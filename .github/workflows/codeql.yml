name: CodeQL

# Static analysis for code-level problems that the dependency audit does not see, in the source and
# in the workflow files. Findings land in the Security tab and as PR annotations.
on:
  push:
    branches: ["main"]
  # No paths filter on pull requests, so the check always reports.
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 3 * * 1" # weekly, so drift is caught even without a push

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
