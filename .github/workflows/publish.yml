name: Publish

# Publishes to npmjs via trusted publishing (OIDC, no NPM_TOKEN; provenance is also requested explicitly), mirrors to
# GitHub Packages, then announces to the org discussions. Trigger by publishing a GitHub Release.
# One release can publish the client, the CLI, or both. A package whose name@version is already on
# the registry is skipped, so bumping one version does not fail the other.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds the client first, then the CLI against it (the workspace links the client).
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination ./out
          npm pack -w cli --pack-destination ./out
      # CycloneDX SBOMs from the lockfile, production dependencies only, one per package.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --omit dev > sbom/barako-client.cdx.json
          npm sbom --sbom-format cyclonedx --omit dev -w cli > sbom/barako.cdx.json
          for f in sbom/*.cdx.json; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            n=$(jq '.components | length' "$f")
            [ "$n" -gt 0 ] || { echo "::error::$f lists no components"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
      packages: write # GITHUB_TOKEN publishes to GitHub Packages
    outputs:
      client: ${{ steps.npmjs.outputs.client }}
      cli: ${{ steps.npmjs.outputs.cli }}
      cli_version: ${{ steps.npmjs.outputs.cli_version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs a newer npm than Node 22 bundles.
      - run: npm install -g npm@12.2.1
      - name: Publish to npmjs (trusted publishing)
        id: npmjs
        run: |
          for tgz in ./out/*.tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            version=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            case "$name" in
              @baryodev/barako-client) key=client ;;
              @baryodev/barako) key=cli ;;
              *) echo "unexpected package $name"; exit 1 ;;
            esac
            echo "${key}_version=$version" >> "$GITHUB_OUTPUT"
            existing=$(npm view "$name@$version" version --registry https://registry.npmjs.org 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "$name@$version is already on npm, skipping"
              echo "$key=false" >> "$GITHUB_OUTPUT"
            else
              npm publish "$tgz" --access public --provenance
              echo "$key=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@baryodev"
      - name: Mirror to GitHub Packages
        run: |
          for tgz in ./out/*.tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            version=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            existing=$(npm view "$name@$version" version --registry https://npm.pkg.github.com 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "$name@$version is already on GitHub Packages, skipping"
            else
              npm publish "$tgz" --registry https://npm.pkg.github.com
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The SBOMs go on the release itself, so a user can read them without a workflow run's artifacts.
  attach-sbom:
    needs: publish
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: sbom
      - name: Upload the SBOMs to the release
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}

  announce:
    needs: publish
    permissions: {}
    if: ${{ !cancelled() && needs.publish.outputs.client == 'true' }}
    uses: BaryoDev/.github/.github/workflows/announce.yml@7d9cbb97e4a8fea9d5244ab6de9b06cb2eab8229 # main
    with:
      package: "@baryodev/barako-client"
      version: ${{ github.event.release.tag_name || github.ref_name }}
      notes: ${{ github.event.release.body }}
      install: "npm i @baryodev/barako-client"
    secrets:
      ANNOUNCE_TOKEN: ${{ secrets.ANNOUNCE_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  announce-cli:
    needs: publish
    permissions: {}
    if: ${{ !cancelled() && needs.publish.outputs.cli == 'true' }}
    uses: BaryoDev/.github/.github/workflows/announce.yml@7d9cbb97e4a8fea9d5244ab6de9b06cb2eab8229 # main
    with:
      package: "@baryodev/barako"
      # The release tag follows the client's version, so announce the CLI's own.
      version: v${{ needs.publish.outputs.cli_version }}
      notes: ${{ github.event.release.body }}
      install: "npm i -g @baryodev/barako"
    secrets:
      ANNOUNCE_TOKEN: ${{ secrets.ANNOUNCE_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
