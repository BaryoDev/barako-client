name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a new advisory against an unchanged lockfile turns the audit job red without a push.
  # The audit, secrets, live and gate jobs run on it. A failed run is the signal; nothing files an issue.
  schedule:
    - cron: "17 4 * * *"
  # By hand, to run the gate on demand. Every job runs then, since the jobs that skip on schedule
  # skip only when the event is the schedule.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Builds again and runs cli/test/*.int.test.ts. The live server suite skips without a server;
      # the MCP pipe test runs against the built CLI.
      - run: npm run test:int

  # The live suite against the pinned core release and against core's master image, so a field
  # type or route core adds before a release turns this red here first. It runs nightly too, so a
  # core change shows without a client push. A failed run is the signal; nothing files an issue.
  live:
    name: Live suite (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core: ["5.9.0", master]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the test stack
        env:
          BARAKO_CMS_TAG: ${{ matrix.core }}
        run: docker compose -f cli/test/compose.yml up -d --wait
      - name: Live suite
        env:
          BARAKO_URL: http://127.0.0.1:5188
        run: npm run test:int
      - name: Server log
        if: failure()
        run: docker compose -f cli/test/compose.yml logs app --tail 200 | sed -E 's/bcms_[A-Za-z0-9_]+/bcms_***/g'
      - name: Stop the test stack
        if: always()
        run: docker compose -f cli/test/compose.yml down -v

  # The local stack from the published images: barako up, a page through Press, the health routes
  # without a redirect, and barako reset. The images are public on ghcr, so no login is needed. The
  # file skips unless BARAKO_STACK_INT is set, so the build and live jobs never start a stack.
  stack:
    name: Local stack
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stack test
        env:
          BARAKO_STACK_INT: "1"
          BARAKO_STACK_PORT: "18080"
        run: npx vitest run --config cli/vitest.int.config.ts cli/test/stack.int.test.ts

  # The nightly gate: each built-in kit on a stack that runs core's master image, driven through
  # barako mcp. One runner per kit, because a stack is one compose project on one port and one
  # subnet, so two kits in one job would clash. Press and Brew stay at the CLI's pins. A red first
  # night may be a real break in core master, not a bug in the gate.
  gate:
    name: Gate (${{ matrix.kit }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kit: [inventory, blog, attendance]
    env:
      BARAKO_GATE_KIT: ${{ matrix.kit }}
      BARAKO_GATE_PORT: "18080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The CLI keeps the client external, and npm ci installs the published one from the lockfile, which
      # may not have a call the CLI uses yet (addField came in 0.7.0). The gate drives the built CLI, so
      # the client built from this commit is packed and unpacked over the installed copy. A real copy, not
      # a link. Only this runner's node_modules changes: the lockfile, the package files and what
      # npm pack -w cli publishes stay as they are.
      - name: Use the client built from this commit
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          dest=node_modules/@baryodev/barako-client
          rm -rf "$dest"
          mkdir -p "$dest"
          tar -xzf "$RUNNER_TEMP/$tarball" --strip-components=1 -C "$dest"
          want=$(node -p "require('./package.json').version")
          got=$(node -p "require('./$dest/package.json').version")
          if [ "$got" != "$want" ]; then
            echo "::error::The installed client is $got, not $want."
            exit 1
          fi
          if ! grep -q addField "$dest/dist/index.js"; then
            echo "::error::The client built from this commit has no addField."
            exit 1
          fi
          echo "The CLI runs the client $got built from this commit."
      # The stack folder is under a temporary HOME, so the runner's own home is never touched. Docker
      # keeps looking for its plugins in the real one.
      - name: Keep the Docker config
        run: echo "DOCKER_CONFIG=${HOME}/.docker" >> "$GITHUB_ENV"
      # A pull that fails here fails loudly, before any stack is started.
      - name: Pull core master
        run: docker pull ghcr.io/baryodev/barako-cms:master
      - name: Start the stack
        env:
          HOME: ${{ runner.temp }}/gate-home
        run: node cli/dist/main.js up --port "$BARAKO_GATE_PORT" --kit "$BARAKO_GATE_KIT" --image core=ghcr.io/baryodev/barako-cms:master
      # Every kit leg must prove it runs the image it was told to, or a green run could be the pinned core.
      - name: Check core runs master
        run: |
          set -uo pipefail
          want=ghcr.io/baryodev/barako-cms:master
          id=$(docker ps -q --filter label=com.docker.compose.project=barako --filter label=com.docker.compose.service=api)
          if [ -z "$id" ] || [ "$(printf '%s\n' "$id" | wc -l)" -ne 1 ]; then
            echo "::error::Expected one api container in the barako project."
            exit 1
          fi
          got=$(docker inspect --format '{{.Config.Image}}' "$id")
          if [ "$got" != "$want" ]; then
            echo "::error::The api container runs $got, not $want."
            exit 1
          fi
          echo "The api container runs $got."
      # An empty kit would make the test file skip and the job go green, so it fails here first.
      - name: Gate test
        env:
          HOME: ${{ runner.temp }}/gate-home
        run: |
          test -n "$BARAKO_GATE_KIT"
          npx --no-install vitest run --config cli/vitest.int.config.ts cli/test/gate.int.test.ts
      # Every secret in the stack folder, and any bcms_ key or token, is masked before a log is printed.
      - name: Container logs
        if: failure()
        env:
          STACK: ${{ runner.temp }}/gate-home/.barako/stack
        run: |
          # No -e: one failed docker logs must not skip the other containers.
          set +e
          set -uo pipefail
          script=$(mktemp)
          # A line is NAME=value in .env and the bare key in api-key. The bcms_ rule below covers a key
          # either way. Only values made of letters, digits, _ and - are added, so none is a sed pattern.
          { cat "$STACK/.env" "$STACK/api-key" 2>/dev/null || true; } | while IFS= read -r line; do
            v="${line#*=}"
            if [[ "$v" =~ ^[A-Za-z0-9_-]{8,}$ ]]; then printf 's/%s/***/g\n' "$v" >> "$script"; fi
          done
          printf '%s\n' 's/bcms_[A-Za-z0-9_-]+/bcms_***/g' 's/eyJ[A-Za-z0-9_.-]*/jwt_***/g' >> "$script"
          for id in $(docker ps -aq --filter label=com.docker.compose.project=barako); do
            echo "::group::$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}} {{.State.Status}} restarts={{.RestartCount}}' "$id")"
            docker logs --tail 200 "$id" 2>&1 | sed -E -f "$script"
            echo "::endgroup::"
          done
      - name: Remove the stack
        if: always()
        env:
          HOME: ${{ runner.temp }}/gate-home
        run: node cli/dist/main.js reset --yes

  # A tag can be moved after review, a commit SHA cannot. Every action in every workflow is pinned
  # by full SHA with the version in a comment, and this fails the build when one is not.
  pins:
    name: Action pins
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Every action is pinned by commit SHA
        run: bash scripts/check-action-pins.sh

      # A check that has only ever passed is not evidence that it can fail.
      - name: The pin check fails on a tag
        run: |
          set -uo pipefail
          d=$(mktemp -d)
          printf 'jobs:\n  j:\n    steps:\n      - uses: actions/checkout@v4\n' > "$d/x.yml"
          if bash scripts/check-action-pins.sh "$d"; then
            echo "::error::the pin check passed a tag pin"; exit 1
          fi

  # One lockfile covers the client and the cli workspace, so one audit covers both. Development
  # dependencies are included: tsup, esbuild and vitest run in the build that produces the published
  # files, and the audit is clean today, so including them costs nothing.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: The audit gate keeps its rules
        run: bash scripts/test-audit-gate.sh

      - name: The SBOM cut keeps its rules
        run: bash scripts/test-sbom-for.sh

      # Critical or High fails the build unless .github/audit-allowlist.json names the advisory
      # with a reason and an expiry date that has not passed. `npm audit` exits non-zero when it
      # finds anything, so its status cannot tell "found vulnerabilities" from "could not run". The
      # report is the signal, and an unreadable one fails the build.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          for attempt in 1 2 3 4 5; do
            timeout 180 npm audit --json > audit.json || true
            if jq -e '.metadata.vulnerabilities.total' audit.json >/dev/null 2>&1; then break; fi
            echo "npm audit attempt $attempt returned no report, retrying in 60s"
            sleep 60
          done
          bash scripts/audit-gate.sh audit.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans history, and the default depth of 1 gives it one commit.
          fetch-depth: 0
          persist-credentials: false

      # The binary is MIT licensed and free. The hosted Action needs a licence for an organization.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

      # A scanner that finds nothing looks the same as one that is not running. Plant a credential
      # and fail if the scan does not catch it. Prefixes are assembled from halves so this file does
      # not match its own rules.
      - name: Prove the scan can fail
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cp .gitleaks.toml "$TMP/.gitleaks.toml"
          AWS_P="AK"; AWS_P="${AWS_P}IA"
          GH_P="gh"; GH_P="${GH_P}p_"
          RAND=$(head -c 256 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9')
          AWS_ID="${AWS_P}$(printf '%s' "${RAND}" | LC_ALL=C tr -d '[:lower:]' | cut -c1-16)"
          GH_TOK="${GH_P}$(printf '%s' "${RAND}" | cut -c1-36)"
          {
            printf 'aws_access_key_id = "%s"\n' "$AWS_ID"
            printf 'gh_token = "%s"\n' "$GH_TOK"
          } > "$TMP/planted.txt"
          # gitleaks exits 1 for a leak and for an error alike, so ask for 42 on a leak and accept
          # nothing else.
          code=0
          gitleaks dir "$TMP" --config "$TMP/.gitleaks.toml" --redact --no-banner --exit-code 42 || code=$?
          if [ "$code" -ne 42 ]; then
            echo "::error::The planted credential scan exited $code, not 42. The gate is not working."
            exit 1
          fi
          echo "Planted secret was caught. The scan is live."
