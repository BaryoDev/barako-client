version: 2
updates:
  # One lockfile at the root covers the client and the cli workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Two pull requests, never one per package: routine bumps in one, majors in another. Majors
      # are kept separate because they are the ones that need reading.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # tsup builds the .d.ts files through the TypeScript compiler API, which TypeScript 7 does
      # not ship. Lift this when a tsup release builds declarations with TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Node types follow the oldest Node the cli supports (engines in cli/package.json), so code
      # cannot call an API that Node version lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
