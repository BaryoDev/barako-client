# Throwaway stack for the integration suite. Test values only, never reuse them.
#
#   docker compose -f cli/test/compose.yml up -d
#   BARAKO_URL=http://127.0.0.1:5188 npm run test:int
#   docker compose -f cli/test/compose.yml down -v
#
# The image needs the core release that serves the CLI routes (5.8.0 or later).

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a # pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: barako_cli_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cli-test-db-password
      # The role the API connects as, created by app-role.sql.
      APP_DB_PASSWORD: cli-test-app-role-7d1e5b
    volumes:
      - ./app-role.sql:/docker-entrypoint-initdb.d/app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/baryodev/barako-cms:${BARAKO_CMS_TAG:-5.9.0}
    ports:
      - "127.0.0.1:5188:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Core 6.0 refuses AllowedHosts "*" in Production. The suite calls http://127.0.0.1:5188.
      AllowedHosts: "localhost;127.0.0.1"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=barako_cli_test;Username=barako_cli_app;Password=cli-test-app-role-7d1e5b
      JWT__Key: cli-test-jwt-key-not-a-secret-0123456789abcdef
      InitialAdmin__Username: cliadmin
      InitialAdmin__Password: Cli-Test-Admin-1234!
      # The suite registers its own user and signs in as it, so no mailbox is needed.
      Auth__RequireEmailVerification: "false"
      Auth__AcknowledgeUnverifiedRegistration: "true"
      Swagger__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy
